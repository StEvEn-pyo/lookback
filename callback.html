<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lookback Studio — TikTok sign-in</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6E7D8;color:#1D1A17;font:16px/1.5 Georgia,serif}
  main{max-width:640px;padding:40px}
  h1{font:italic 700 34px Georgia,serif;margin:0 0 6px}
  p{color:#5b5148}
  textarea{width:100%;height:130px;padding:12px;border:1px solid #d9c8b4;border-radius:10px;font:14px/1.4 ui-monospace,Consolas,monospace;background:#fffdf9}
  .ok{color:#1d6b3a}
</style>
</head>
<body>
<main>
  <h1>Lookback Studio</h1>
  <p id="msg">Finishing the TikTok connection…</p>
  <textarea id="out" readonly></textarea>
  <p id="hint" class="ok" hidden>Code copied. Paste it into the studio terminal.</p>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const code = p.get('code') || p.get('auth_code') || '';
  const err = p.get('error') || p.get('error_description') || '';
  const out = document.getElementById('out');
  const msg = document.getElementById('msg');
  if (code) {
    out.value = code;
    msg.textContent = 'Authorised. This is the one-time code:';
    out.select();
    try { navigator.clipboard.writeText(code); document.getElementById('hint').hidden = false; } catch (e) {}
  } else if (err) {
    out.value = err;
    msg.textContent = 'TikTok returned an error:';
  } else {
    out.value = location.href;
    msg.textContent = 'No code in the URL. Full address:';
  }
</script>
</body>
</html>
